<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Borahae Archive — Fanfics, One-Shots & Omegaverse BTS</title>
<style>
:root{--bg:#0d0a14;--surface:#171224;--surface2:#221a36;--text:#f3eefc;--muted:#b4a7cc;--accent:#9d4edd;--accent2:#c77dff;--border:rgba(199,125,255,.18);--danger:#ff5c8a;--ok:#5ce1a6;--font-ui:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--font-read:Georgia,Cambria,"Times New Roman",serif;--read-size:18px}
body.theme-cream{--bg:#f6f1e7;--surface:#fffdf8;--surface2:#efe7d6;--text:#231c2e;--muted:#655a78;--accent:#7b2cbf;--accent2:#5a189a;--border:rgba(90,24,154,.16)}
body.theme-light{--bg:#f8f6fc;--surface:#ffffff;--surface2:#efe9fa;--text:#1b1526;--muted:#5e5273;--accent:#7b2cbf;--accent2:#9d4edd;--border:rgba(123,44,191,.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);line-height:1.55;min-height:100vh;transition:background .2s,color .2s}
a{color:var(--accent2);text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 86%,transparent);border-bottom:1px solid var(--border)}
.nav{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;letter-spacing:.3px}
.brand-badge{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1rem}
.nav-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 14px;border-radius:10px;font-size:.88rem;font-weight:600;background:var(--surface2);border:1px solid var(--border);transition:.15s}
.btn:hover:not(:disabled){border-color:var(--accent2);transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
.btn-sm{padding:6px 10px;font-size:.8rem;border-radius:8px}
.hero{margin:20px 0;padding:22px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,var(--surface)),var(--surface));border:1px solid var(--border)}
.hero h1{font-size:1.55rem;margin-bottom:6px}
.hero p{color:var(--muted);font-size:.95rem;max-width:720px}
.continue-bar{margin-bottom:18px;padding:14px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.continue-meta{font-size:.82rem;color:var(--muted)}
.continue-title{font-weight:700;font-size:1rem;margin-top:2px}
.controls{display:grid;gap:12px;margin-bottom:18px}
.search-row{display:flex;gap:10px;flex-wrap:wrap}
.input,.select,.textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 13px;font-size:.92rem}
.input:focus,.select:focus,.textarea:focus{outline:2px solid color-mix(in srgb,var(--accent2) 55%,transparent);border-color:var(--accent2)}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{padding:6px 12px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.card:hover{border-color:var(--accent2)}
.meta-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.rating{padding:2px 8px;border-radius:6px;font-weight:700;background:var(--surface2);color:var(--accent2)}
.rating.adult{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger)}
.title{font-size:1.15rem;font-weight:700;margin:4px 0}
.author{font-size:.84rem;color:var(--muted)}
.synopsis{font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.74rem;padding:3px 8px;border-radius:7px;background:var(--surface2);color:var(--text)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--border);font-size:.82rem;color:var(--muted)}
.reader-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px}
.reader-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;background:var(--surface2);margin:14px 0}
.chapter-body{font-family:var(--font-read);font-size:var(--read-size);line-height:1.85;white-space:pre-line;margin:18px 0}
.chapter-body.sans{font-family:var(--font-ui)}
.note-box{background:var(--surface2);border-left:4px solid var(--accent2);padding:12px 14px;border-radius:10px;margin:12px 0;font-size:.9rem}
.warn-gate{text-align:center;padding:32px 18px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);margin:14px 0}
.comments{margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.comment{padding:10px 12px;border-radius:10px;background:var(--surface2);margin-top:8px;font-size:.88rem}
.form-grid{display:grid;gap:12px;max-width:740px}
.form-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.editor-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface2);padding:10px 14px;border-radius:12px;font-size:.84rem;color:var(--muted)}
.preview-box{margin-top:14px;padding:18px;border-radius:14px;background:var(--surface2);border:1px solid var(--border)}
label{display:block;font-size:.84rem;font-weight:600;margin-bottom:4px;color:var(--muted)}
.toast{position:fixed;bottom:18px;right:18px;z-index:60;background:var(--accent);color:#fff;padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none}
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:16px}
@media(max-width:600px){.hero h1{font-size:1.3rem}.reader-box{padding:15px}}
</style>
</head>
<body>
<header>
  <div class="nav">
    <button class="brand" onclick="setView('archive')">
      <span class="brand-badge">💜</span>
      <span>Borahae Archive</span>
    </button>
    <div class="nav-btns">
      <button class="btn btn-sm" onclick="setView('archive')">Archivo</button>
      <button class="btn btn-sm" onclick="setView('saved')">Guardados (<span id="savedCount">0</span>)</button>
      <button class="btn btn-sm" onclick="setView('profile')">Mi Perfil</button>
      <button class="btn btn-primary btn-sm" onclick="openEditor()">+ Publicar Fic</button>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "borahae_archive_v1";
const SHIPS = ["Todos","Yoonmin","Taekook","Namjin","Sope","Vmin","Jikook","OT7","Reader/OC"];
const CATS = ["Todos","Omegaverse","One-Shot","AU","Angst","Fluff","Misterio"];
const RATINGS = ["Todo público","+13 Teen","+16","+18 Explícito"];

const DEFAULT_STORIES = [
  {
    id:"fic-1",
    title:"Lluvia en el cuarto de ensayo",
    author:"@min_borahae",
    ship:"Yoonmin",
    category:"One-Shot",
    rating:"+13 Teen",
    warnings:["Final feliz"],
    tags:["Fluff","Invierno","Café","Confesión"],
    synopsis:"Después de horas practicando una coreografía nueva, un corte de luz deja a Yoongi y Jimin atrapados en el estudio con un termo de té y palabras que venían guardando hace meses.",
    status:"Completada",
    updated:"2026-10-12",
    likes:48,
    chapters:[
      {
        title:"Capítulo único: El ruido de la lluvia",
        authorNote:"Escrito con lluvia de fondo y café tibio. ¡Espero que les abrigue el corazón!",
        song:"BTS — Rain",
        body:"La lluvia golpeaba contra los ventanales altos del piso inferior con un ritmo parejo que parecía marcar el compás de lo que ninguno de los dos se animaba a decir.\n\nJimin se dejó caer sobre la colchoneta, estirando las piernas cansadas, mientras Yoongi revisaba la pista en el parlante portátil hasta que la luz parpadeó dos veces y se apagó por completo.\n\n—Bueno —murmuró Yoongi en la penumbra, sin moverse de su lugar—. Parece que hoy no hay más ensayos.\n\nJimin soltó una risa bajita y buscó a tientas la botella de agua. Cuando sus dedos rozaron los de Yoongi, ninguno apartó la mano de inmediato."
      }
    ],
    comments:[
      {user:"@army_nube",text:"Qué paz transmite este one-shot, necesitaba algo así hoy 💜",date:"2026-10-13"}
    ]
  },
  {
    id:"fic-2",
    title:"Ceniza y pétalos de loto",
    author:"@luna_omega",
    ship:"Taekook",
    category:"Omegaverse",
    rating:"+18 Explícito",
    warnings:["Angst fuerte","Nudos / Celo"],
    tags:["Omegaverse","Alma gemela","Reencuentro","Supresores"],
    synopsis:"En una Seúl dividida por los pactos entre clanes, un omega que oculta su aroma tras supresores vuelve a cruzarse con el alfa que juró protegerlo cinco inviernos atrás.",
    status:"En emisión",
    updated:"2026-10-18",
    likes:92,
    chapters:[
      {
        title:"Capítulo 1: El aroma que no se olvida",
        authorNote:"Advertencia: temas intensos de dinámica alfa/omega y reencuentro con herida previa.",
        song:"Jungkook — Still With You",
        body:"Los supresores de nueva generación prometían borrar cualquier rastro de esencia en menos de veinte minutos, pero nadie hablaba de lo que pasaba cuando el instinto reconocía la voz antes que el aroma.\n\nTaehyung cruzó el umbral del salón sin mirar a los costados, hasta que el aire cambió apenas un grado y su respiración se detuvo."
      },
      {
        title:"Capítulo 2: Promesa bajo cero",
        authorNote:"Gracias por leer y dejar sus teorías sobre lo que pasó hace cinco años.",
        song:"V — Winter Bear",
        body:"La fiebre del celo venía adelantándose desde el amanecer, y Jungkook se negó a dejarlo solo en la sala de descanso a pesar de las reglas estrictas del distrito.\n\n—No tenés que decirme nada hoy —dijo en voz baja, acomodando la manta sobre sus hombros—. Solo respirá."
      }
    ],
    comments:[
      {user:"@kookie_violeta",text:"¡Ese final del capítulo 2 me dejó sin aire! Esperando el próximo.",date:"2026-10-19"}
    ]
  },
  {
    id:"fic-3",
    title:"Frecuencia de medianoche",
    author:"@seoul_diario",
    ship:"Namjin",
    category:"AU",
    rating:"Todo público",
    warnings:["Final feliz"],
    tags:["Radio","Slice of life","Madrugada","Slow burn"],
    synopsis:"Una radio independiente de madrugada conecta a un conductor nocturno con el panadero de la esquina que llama cada noche para pedir una canción distinta.",
    status:"Completada",
    updated:"2026-10-05",
    likes:63,
    chapters:[
      {
        title:"Capítulo 1: Dial 98.7",
        authorNote:"Un AU tranquilo para leer de noche con auriculares.",
        song:"Jin — Moon",
        body:"A las 01:14 de la madrugada, la línea de oyentes de la radio casi nunca sonaba. Casi nunca.\n\n—Hola, 98.7 —dijo una voz serena, acompañada por el tintineo suave de una cuchara contra una taza—. ¿Todavía queda lugar para un pedido fuera de horario?"
      }
    ],
    comments:[]
  }
];

const DEFAULT_STATE = {
  profile:{handle:"@army_autora",bias:"OT7",bio:"Escribiendo one-shots, AUs y sagas Omegaverse con amor ARMY 💜"},
  prefs:{theme:"dark",font:"serif",fontSize:18,allowAdult:false},
  saved:[],
  lastRead:null,
  stories:DEFAULT_STORIES
};

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return {
      profile:{...DEFAULT_STATE.profile,...(parsed.profile||{})},
      prefs:{...DEFAULT_STATE.prefs,...(parsed.prefs||{})},
      saved:Array.isArray(parsed.saved)?parsed.saved:[],
      lastRead:parsed.lastRead && typeof parsed.lastRead === "object" ? parsed.lastRead : null,
      stories:Array.isArray(parsed.stories)&&parsed.stories.length?parsed.stories:structuredClone(DEFAULT_STATE.stories)
    };
  }catch(e){
    return structuredClone(DEFAULT_STATE);
  }
}

let state = loadState();
let view = "archive";
let filterShip = "Todos";
let filterCat = "Todos";
let searchQuery = "";
let activeStoryId = null;
let activeChapterIdx = 0;
let adultConfirmedId = null;
let editStoryId = null;
let showPreview = false;

function saveState(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  document.getElementById("savedCount").textContent = state.saved.length;
  applyPrefs();
}

function applyPrefs(){
  document.body.classList.remove("theme-cream","theme-light");
  if(state.prefs.theme === "cream") document.body.classList.add("theme-cream");
  if(state.prefs.theme === "light") document.body.classList.add("theme-light");
  document.documentElement.style.setProperty("--read-size", state.prefs.fontSize + "px");
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ el.style.display = "none"; }, 2400);
}

function esc(str=""){
  return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function countWords(text=""){
  const trimmed = String(text).trim();
  if(!trimmed) return 0;
  return trimmed.split(/\s+/).length;
}

function recordLastRead(storyId, chIdx){
  const st = state.stories.find(x => x.id === storyId);
  if(!st) return;
  const safeIdx = Math.min(Math.max(0, chIdx), st.chapters.length - 1);
  state.lastRead = {storyId:st.id, chapterIdx:safeIdx, updated:new Date().toISOString().slice(0,10)};
  saveState();
}

function setView(nextView){
  view = nextView;
  showPreview = false;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function openStory(id, chIdx=0){
  activeStoryId = id;
  activeChapterIdx = chIdx;
  view = "reader";
  showPreview = false;
  recordLastRead(id, chIdx);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function continueReading(){
  if(!state.lastRead) return;
  const st = state.stories.find(x => x.id === state.lastRead.storyId);
  if(!st){
    state.lastRead = null;
    saveState();
    render();
    return;
  }
  const safeIdx = Math.min(Math.max(0, state.lastRead.chapterIdx || 0), st.chapters.length - 1);
  openStory(st.id, safeIdx);
}

function openEditor(storyId=null){
  editStoryId = storyId;
  view = "editor";
  showPreview = false;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function toggleSaved(id){
  if(state.saved.includes(id)){
    state.saved = state.saved.filter(x => x !== id);
    toast("Quitado de Guardados");
  }else{
    state.saved.push(id);
    toast("Guardado en tu biblioteca 💜");
  }
  saveState();
  if(view === "saved" || view === "reader") render();
}

function toggleLike(id){
  const st = state.stories.find(s => s.id === id);
  if(!st) return;
  st.likes = (st.likes || 0) + 1;
  saveState();
  render();
  toast("¡Enviaste amor a esta historia! 💜");
}

function downloadChapterTxt(story, chIdx){
  const ch = story.chapters[chIdx] || story.chapters[0];
  const content = `${story.title}\nAutor/a: ${story.author}\nShip: ${story.ship} | Categoría: ${story.category} | Clasificación: ${story.rating}\n${ch.title}\n${ch.song ? "Banda sonora: " + ch.song + "\n" : ""}${ch.authorNote ? "Notas: " + ch.authorNote + "\n" : ""}\n${ch.body}`;
  const blob = new Blob([content],{type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${story.title.toLowerCase().replace(/[^a-z0-9]+/gi,"-")}-cap-${chIdx+1}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  toast("Capítulo descargado (.txt)");
}

function exportJsonBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "borahae-archive-respaldo.json";
  a.click();
  URL.revokeObjectURL(url);
  toast("Respaldo .json descargado");
}

function importJsonBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.stories)) throw new Error("Formato inválido");
      state = {
        profile:{...DEFAULT_STATE.profile,...(data.profile||{})},
        prefs:{...DEFAULT_STATE.prefs,...(data.prefs||{})},
        saved:Array.isArray(data.saved)?data.saved:[],
        lastRead:data.lastRead && typeof data.lastRead === "object" ? data.lastRead : null,
        stories:data.stories
      };
      saveState();
      render();
      toast("Respaldo restaurado con éxito 💜");
    }catch(e){
      toast("No se pudo leer el archivo .json");
    }
  };
  reader.readAsText(file);
}

function getFilteredStories(){
  const q = searchQuery.trim().toLowerCase();
  return state.stories.filter(s => {
    const matchShip = filterShip === "Todos" || s.ship === filterShip;
    const matchCat = filterCat === "Todos" || s.category === filterCat;
    const hay = `${s.title} ${s.author} ${s.ship} ${s.category} ${s.synopsis} ${(s.tags||[]).join(" ")} ${(s.warnings||[]).join(" ")}`.toLowerCase();
    const matchQ = !q || hay.includes(q);
    return matchShip && matchCat && matchQ;
  });
}

function renderContinueBox(){
  if(!state.lastRead) return "";
  const st = state.stories.find(x => x.id === state.lastRead.storyId);
  if(!st) return "";
  const chIdx = Math.min(Math.max(0, state.lastRead.chapterIdx || 0), st.chapters.length - 1);
  const ch = st.chapters[chIdx];
  return `
    <section class="continue-bar">
      <div>
        <div class="continue-meta">📖 Continuar donde quedaste · ${esc(st.ship)} · ${esc(st.category)}</div>
        <div class="continue-title">${esc(st.title)} <span style="font-weight:400;color:var(--muted);font-size:.88rem">— ${esc(ch ? ch.title : "Capítulo "+(chIdx+1))}</span></div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="continueReading()">Seguir leyendo →</button>
    </section>
  `;
}

function renderCard(s){
  const isAdult = s.rating.startsWith("+16") || s.rating.startsWith("+18");
  const isSaved = state.saved.includes(s.id);
  return `
    <article class="card">
      <div>
        <div class="meta-top">
          <span>${esc(s.ship)} · ${esc(s.category)} · ${s.chapters.length} cap.</span>
          <span class="rating ${isAdult?"adult":""}">${esc(s.rating)}</span>
        </div>
        <h3 class="title"><a href="#${esc(s.id)}" onclick="event.preventDefault();openStory('${esc(s.id)}')">${esc(s.title)}</a></h3>
        <div class="author">por ${esc(s.author)} · ${esc(s.status)}</div>
        <p class="synopsis" style="margin-top:8px">${esc(s.synopsis)}</p>
        <div class="tags" style="margin-top:10px">
          ${(s.warnings||[]).map(w=>`<span class="tag">⚠️ ${esc(w)}</span>`).join("")}
          ${(s.tags||[]).slice(0,4).map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}
        </div>
      </div>
      <div class="card-foot">
        <span>💜 ${s.likes||0} · 💬 ${(s.comments||[]).length}</span>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" onclick="toggleSaved('${esc(s.id)}')">${isSaved?"Guardado":"Guardar"
function renderReader(){
  const s = state.stories.find(x => x.id === activeStoryId) || state.stories[0];
  if(!s) return renderArchive(getFilteredStories());
  const chIdx = Math.min(Math.max(0, activeChapterIdx), s.chapters.length - 1);
  recordLastRead(s.id, chIdx);
  const ch = s.chapters[chIdx];
  const isAdult = s.rating.startsWith("+16") || s.rating.startsWith("+18");
  const blocked = isAdult && !state.prefs.allowAdult && adultConfirmedId !== s.id;
  const isSaved = state.saved.includes(s.id);

  return `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <button class="btn btn-sm" onclick="setView('archive')">← Volver al archivo</button>
      <button class="btn btn-sm" onclick="openEditor('${esc(s.id)}')">+ Agregar capítulo / Editar</button>
      <button class="btn btn-sm" onclick="toggleSaved('${esc(s.id)}')">${isSaved?"🔖 Guardada":"🔖 Guardar"}</button>
      <button class="btn btn-sm" onclick="toggleLike('${esc(s.id)}')">💜 Dar amor (${s.likes||0})</button>
      <button class="btn btn-sm" onclick="downloadChapterTxt(state.stories.find(x=>x.id==='${esc(s.id)}'), ${chIdx})">⬇️ Descargar .txt</button>
    </div>
    <article class="reader-box">
      <div class="meta-top">
        <span>${esc(s.ship)} · ${esc(s.category)} · ${esc(s.status)}</span>
        <span class="rating ${isAdult?"adult":""}">${esc(s.rating)}</span>
      </div>
      <h1 style="font-size:1.5rem;margin-top:6px">${esc(s.title)}</h1>
      <div class="author">por ${esc(s.author)} · Actualizado ${esc(s.updated)}</div>
      <p style="margin-top:10px;color:var(--muted);font-size:.92rem">${esc(s.synopsis)}</p>
      <div class="tags" style="margin-top:10px">
        ${(s.warnings||[]).map(w=>`<span class="tag">⚠️ ${esc(w)}</span>`).join("")}
        ${(s.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}
      </div>

      <div class="reader-toolbar">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <select class="select" style="width:auto;padding:6px 10px" onchange="activeChapterIdx=Number(this.value);recordLastRead('${esc(s.id)}',activeChapterIdx);render()">
            ${s.chapters.map((c,i)=>`<option value="${i}" ${i===chIdx?"selected":""}>${esc(c.title || "Capítulo "+(i+1))}</option>`).join("")}
          </select>
          <button class="btn btn-sm" ${chIdx===0?"disabled":""} onclick="activeChapterIdx=${chIdx-1};recordLastRead('${esc(s.id)}',activeChapterIdx);render()">← Anterior</button>
          <button class="btn btn-sm" ${chIdx>=s.chapters.length-1?"disabled":""} onclick="activeChapterIdx=${chIdx+1};recordLastRead('${esc(s.id)}',activeChapterIdx);render()">Siguiente →</button>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <button class="btn btn-sm" onclick="state.prefs.theme='dark';saveState();render()">Noche</button>
          <button class="btn btn-sm" onclick="state.prefs.theme='cream';saveState();render()">Crema</button>
          <button class="btn btn-sm" onclick="state.prefs.theme='light';saveState();render()">Claro</button>
          <button class="btn btn-sm" onclick="state.prefs.fontSize=Math.max(14,state.prefs.fontSize-2);saveState();render()">A-</button>
          <button class="btn btn-sm" onclick="state.prefs.fontSize=Math.min(26,state.prefs.fontSize+2);saveState();render()">A+</button>
          <button class="btn btn-sm" onclick="state.prefs.font=state.prefs.font==='serif'?'sans':'serif';saveState();render()">${state.prefs.font==='serif'?'Sans':'Serif'}</button>
        </div>
      </div>

      ${blocked ? `
        <div class="warn-gate">
          <h3>⚠️ Contenido clasificado ${esc(s.rating)}</h3>
          <p style="color:var(--muted);margin:8px 0 14px">Advertencias: ${esc((s.warnings||[]).join(", ") || "Contenido maduro")}</p>
          <button class="btn btn-primary" onclick="adultConfirmedId='${esc(s.id)}';render()">Continuar bajo mi responsabilidad</button>
        </div>
      ` : `
        <h2 style="font-size:1.2rem;margin-top:8px">${esc(ch.title)}</h2>
        ${ch.song ? `<div class="note-box">🎵 <strong>Banda sonora recomendada:</strong> ${esc(ch.song)}</div>` : ""}
        ${ch.authorNote ? `<div class="note-box">✍️ <strong>Notas de autora:</strong> ${esc(ch.authorNote)}</div>` : ""}
        <div class="chapter-body ${state.prefs.font==='sans'?'sans':''}">${esc(ch.body)}</div>
        <div style="display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap">
          <button class="btn" ${chIdx===0?"disabled":""} onclick="activeChapterIdx=${chIdx-1};recordLastRead('${esc(s.id)}',activeChapterIdx);render()">← Capítulo anterior</button>
          <button class="btn btn-primary" ${chIdx>=s.chapters.length-1?"disabled":""} onclick="activeChapterIdx=${chIdx+1};recordLastRead('${esc(s.id)}',activeChapterIdx);render()">Siguiente capítulo →</button>
        </div>
      `}

      <div class="comments">
        <h3 style="font-size:1rem">Comentarios de lectoras (${(s.comments||[]).length})</h3>
        <form onsubmit="event.preventDefault();addComment('${esc(s.id)}',this)" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <input class="input" style="flex:1;min-width:200px" name="text" placeholder="Dejá un comentario lindo para la autora..." required>
          <button class="btn btn-primary" type="submit">Comentar</button>
        </form>
        ${(s.comments||[]).slice().reverse().map(c=>`
          <div class="comment">
            <strong>${esc(c.user)}</strong> <span style="color:var(--muted);font-size:.76rem">· ${esc(c.date)}</span>
            <p style="margin-top:4px">${esc(c.text)}</p>
          </div>
        `).join("")}
      </div>
    </article>
  `;
}

function addComment(storyId, form){
  const txt = form.text.value.trim();
  if(!txt) return;
  const st = state.stories.find(x => x.id === storyId);
  if(!st) return;
  st.comments = st.comments || [];
  st.comments.push({user:state.profile.handle || "@army",text:txt,date:new Date().toISOString().slice(0,10)});
  saveState();
  render();
  toast("Comentario publicado 💜");
}

function updateWordCounter(){
  const bodyEl = document.getElementById("chapterBodyInput");
  const countEl = document.getElementById("wordCountLabel");
  if(!bodyEl || !countEl) return;
  const words = countWords(bodyEl.value);
  countEl.textContent = `${words} ${words === 1 ? "palabra" : "palabras"}`;
  if(showPreview) renderChapterPreviewBox();
}

function toggleEditorPreview(){
  showPreview = !showPreview;
  renderChapterPreviewBox();
  const btn = document.getElementById("togglePreviewBtn");
  if(btn) btn.textContent = showPreview ? "Ocultar vista previa" : "👁️ Vista previa";
}

function renderChapterPreviewBox(){
  const box = document.getElementById("editorPreviewBox");
  const form = document.getElementById("storyEditorForm");
  if(!box || !form) return;
  if(!showPreview){
    box.style.display = "none";
    box.innerHTML = "";
    return;
  }
  const chTitle = (form.chTitle?.value || "").trim() || "Capítulo sin título";
  const song = (form.song?.value || "").trim();
  const authorNote = (form.authorNote?.value || "").trim();
  const body = form.body?.value || "";
  const words = countWords(body);

  box.style.display = "block";
  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <span style="font-size:.78rem;font-weight:700;color:var(--accent2)">VISTA PREVIA DEL CAPÍTULO</span>
      <span style="font-size:.78rem;color:var(--muted)">${words} ${words === 1 ? "palabra" : "palabras"}</span>
    </div>
    <h3 style="font-size:1.15rem;margin-bottom:8px">${esc(chTitle)}</h3>
    ${song ? `<div class="note-box" style="background:var(--surface)">🎵 <strong>Banda sonora recomendada:</strong> ${esc(song)}</div>` : ""}
    ${authorNote ? `<div class="note-box" style="background:var(--surface)">✍️ <strong>Notas de autora:</strong> ${esc(authorNote)}</div>` : ""}
    <div class="chapter-body ${state.prefs.font==='sans'?'sans':''}" style="margin:12px 0 0">${esc(body || "Todavía no escribiste el cuerpo del capítulo.")}</div>
  `;
}

function renderEditor(){
  const existing = editStoryId ? state.stories.find(x => x.id === editStoryId) : null;
  const isAddingChapter = Boolean(existing);
  const nextCapNum = existing ? existing.chapters.length + 1 : 1;

  return `
    <div style="margin-bottom:14px">
      <button class="btn btn-sm" onclick="setView('archive')">← Cancelar y volver</button>
    </div>
    <section class="reader-box">
      <h1 style="font-size:1.35rem;margin-bottom:4px">${isAddingChapter ? `Agregar capítulo a "${esc(existing.title)}"` : "Publicar nueva historia en Borahae Archive"}</h1>
      <p style="color:var(--muted);font-size:.9rem;margin-bottom:16px">${isAddingChapter ? "Sumá un nuevo capítulo a esta saga o historia sin perder los anteriores." : "Completá los datos de tu fic, one-shot o Omegaverse y publicá al instante."}</p>
      <form id="storyEditorForm" class="form-grid" onsubmit="event.preventDefault();saveStoryForm(this)">
        ${!isAddingChapter ? `
          <div class="form-2">
            <div>
              <label>Título de la historia</label>
              <input class="input" name="title" required placeholder="Ej: Noches de Seúl">
            </div>
            <div>
              <label>Autor/a (@usuario)</label>
              <input class="input" name="author" value="${esc(state.profile.handle)}" required>
            </div>
          </div>
          <div class="form-2">
            <div>
              <label>Ship principal</label>
              <select class="select" name="ship">${SHIPS.filter(x=>x!=="Todos").map(x=>`<option>${x}</option>`).join("")}</select>
            </div>
            <div>
              <label>Categoría / Tropo</label>
              <select class="select" name="category">${CATS.filter(x=>x!=="Todos").map(x=>`<option>${x}</option>`).join("")}</select>
            </div>
          </div>
          <div class="form-2">
            <div>
              <label>Clasificación por edad</label>
              <select class="select" name="rating">${RATINGS.map(x=>`<option>${x}</option>`).join("")}</select>
            </div>
            <div>
              <label>Estado</label>
              <select class="select" name="status"><option>En emisión</option><option>Completada</option></select>
            </div>
          </div>
          <div>
            <label>Advertencias (separadas por coma)</label>
            <input class="input" name="warnings" placeholder="Ej: Final feliz, Nudos / Celo, Angst fuerte">
          </div>
          <div>
            <label>Etiquetas / Tags (separadas por coma)</label>
            <input class="input" name="tags" placeholder="Ej: Omegaverse, Slow burn, Invierno, Soulmates">
          </div>
          <div>
            <label>Sinopsis</label>
            <textarea class="textarea" name="synopsis" rows="3" required placeholder="Contá de qué trata la historia..."></textarea>
          </div>
        ` : ""}
        <div class="form-2">
          <div>
            <label>Título del capítulo</label>
            <input class="input" name="chTitle" value="Capítulo ${nextCapNum}" required oninput="if(showPreview)renderChapterPreviewBox()">
          </div>
          <div>
            <label>Banda sonora recomendada (opcional)</label>
            <input class="input" name="song" placeholder="Ej: BTS — Spring Day" oninput="if(showPreview)renderChapterPreviewBox()">
          </div>
        </div>
        <div>
          <label>Notas de la autora (opcional)</label>
          <textarea class="textarea" name="authorNote" rows="2" placeholder="Un mensajito para tus lectoras..." oninput="if(showPreview)renderChapterPreviewBox()"></textarea>
        </div>
        <div>
          <label>Texto del capítulo</label>
          <textarea id="chapterBodyInput" class="textarea" name="body" rows="10" required placeholder="Escribí tu capítulo acá..." oninput="updateWordCounter()"></textarea>
        </div>
        <div class="editor-bar">
          <span id="wordCountLabel">0 palabras</span>
          <button id="togglePreviewBtn" class="btn btn-sm" type="button" onclick="toggleEditorPreview()">👁️ Vista previa</button>
        </div>
        <div id="editorPreviewBox" class="preview-box" style="display:none"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary" type="submit">${isAddingChapter ? "Publicar nuevo capítulo" : "Publicar historia"}</button>
        </div>
      </form>
    </section>
  `;
}

function saveStoryForm(form){
  const today = new Date().toISOString().slice(0,10);
  if(editStoryId){
    const st = state.stories.find(x => x.id === editStoryId);
    if(!st) return;
    st.chapters.push({
      title:form.chTitle.value.trim(),
      song:form.song.value.trim(),
      authorNote:form.authorNote.value.trim(),
      body:form.body.value
    });
    st.updated = today;
    const newIdx = st.chapters.length - 1;
    editStoryId = null;
    showPreview = false;
    saveState();
    toast("¡Capítulo agregado! 💜");
    openStory(st.id, newIdx);
    return;
  }

  const id = "fic-" + Date.now();
  const warnings = (form.warnings.value || "").split(",").map(s=>s.trim()).filter(Boolean);
  const tags = (form.tags.value || "").split(",").map(s=>s.trim()).filter(Boolean);
  const newStory = {
    id,
    title:form.title.value.trim(),
    author:form.author.value.trim() || state.profile.handle,
    ship:form.ship.value,
    category:form.category.value,
    rating:form.rating.value,
    status:form.status.value,
    warnings:warnings.length ? warnings : ["Sin advertencias"],
    tags,
    synopsis:form.synopsis.value.trim(),
    updated:today,
    likes:0,
    chapters:[{
      title:form.chTitle.value.trim(),
      song:form.song.value.trim(),
      authorNote:form.authorNote.value.trim(),
      body:form.body.value
    }],
    comments:[]
  };
  state.stories.unshift(newStory);
  showPreview = false;
  saveState();
  toast("¡Historia publicada en Borahae Archive! 💜");
  openStory(id, 0);
}

function renderProfile(){
  const myStories = state.stories.filter(s => s.author.toLowerCase() === (state.profile.handle||"").toLowerCase());
  return `
    <section class="reader-box" style="margin-bottom:18px">
      <h1 style="font-size:1.35rem;margin-bottom:12px">Mi Perfil ARMY</h1>
      <form class="form-grid" onsubmit="event.preventDefault();saveProfileForm(this)">
        <div class="form-2">
          <div>
            <label>Tu @usuario o seudónimo</label>
            <input class="input" name="handle" value="${esc(state.profile.handle)}" required>
          </div>
          <div>
            <label>Bias / Wreck</label>
            <input class="input" name="bias" value="${esc(state.profile.bias)}">
          </div>
        </div>
        <div>
          <label>Biografía corta</label>
          <input class="input" name="bio" value="${esc(state.profile.bio)}">
        </div>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text)">
          <input type="checkbox" name="allowAdult" ${state.prefs.allowAdult?"checked":""}>
          Mostrar historias +16 / +18 sin pantalla de confirmación previa
        </label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary" type="submit">Guardar perfil</button>
          <button class="btn" type="button" onclick="exportJsonBackup()">💾 Respaldar todo (.json)</button>
          <label class="btn" style="margin:0">📂 Restaurar .json <input type="file" accept=".json,application/json" style="display:none" onchange="importJsonBackup(this.files[0])"></label>
        </div>
      </form>
    </section>
    <h2 style="font-size:1.1rem;margin-bottom:12px">Mis historias publicadas (${myStories.length})</h2>
    ${myStories.length ? `<div class="grid">${myStories.map(renderCard).join("")}</div>` : `<div class="empty">Todavía no publicaste historias con ${esc(state.profile.handle)}. Tocá "+ Publicar Fic" para empezar 💜</div>`}
  `;
}

function saveProfileForm(form){
  state.profile.handle = form.handle.value.trim() || "@army_autora";
  state.profile.bias = form.bias.value.trim() || "OT7";
  state.profile.bio = form.bio.value.trim();
  state.prefs.allowAdult = form.allowAdult.checked;
  saveState();
  render();
  toast("Perfil actualizado 💜");
}

function render(){
  document.getElementById("savedCount").textContent = state.saved.length;
  const app = document.getElementById("app");
  if(view === "reader") app.innerHTML = renderReader();
  else if(view === "editor") app.innerHTML = renderEditor();
  else if(view === "profile") app.innerHTML = renderProfile();
  else if(view === "saved"){
    const savedList = state.stories.filter(s => state.saved.includes(s.id));
    app.innerHTML = renderArchive(savedList, "Mi biblioteca guardada");
  }else{
    app.innerHTML = renderArchive(getFilteredStories());
  }
}

applyPrefs();
render();
</script>
</body>
</html>
